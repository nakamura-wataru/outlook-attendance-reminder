<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">ときともの通知画面</title>
  <desc id="desc">打刻画面を開くボタンと再通知までの時間を選ぶ欄がある通知画面</desc>
  <rect width="960" height="600" fill="#0e1015"/>
  <rect x="150" y="76" width="660" height="448" rx="16" fill="#0e1015" stroke="#343945"/>
  <circle cx="178" cy="104" r="7" fill="#ff625a"/><circle cx="202" cy="104" r="7" fill="#ffbe2e"/><circle cx="226" cy="104" r="7" fill="#28c840"/>
  <text x="254" y="110" fill="#e9ebf0" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif" font-size="17" font-weight="700">退勤リマインダー</text>
  <rect x="182" y="136" width="596" height="124" rx="10" fill="#161922" stroke="#262a34"/>
  <circle cx="226" cy="198" r="26" fill="#1c2040" stroke="#7b84ff" stroke-width="2"/>
  <circle cx="226" cy="198" r="15" fill="none" stroke="#aeb4ff" stroke-width="2"/><path d="M226 198v-10m0 10 9 5" fill="none" stroke="#aeb4ff" stroke-width="2" stroke-linecap="round"/>
  <text x="274" y="178" fill="#e9ebf0" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif" font-size="19" font-weight="700">打刻しましょう！</text>
  <text x="274" y="207" fill="#99a0ae" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif" font-size="14">退勤予定時刻になりました。KING OF TIMEで退勤を確認してください。</text>
  <rect x="182" y="282" width="158" height="36" rx="8" fill="#303542"/>
  <text x="201" y="306" fill="#e9ebf0" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif" font-size="14" font-weight="700">打刻画面を開く</text>
  <rect x="182" y="346" width="200" height="132" rx="10" fill="#1c2040" stroke="#7b84ff"/>
  <text x="204" y="376" fill="#e9ebf0" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700">再通知までの時間</text>
  <rect x="204" y="392" width="156" height="46" rx="8" fill="#303542" stroke="#7b84ff"/>
  <text x="222" y="421" fill="#e9ebf0" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif" font-size="17" font-weight="700">10分後</text>
  <path d="M332 408l6 6 6-6" fill="none" stroke="#e9ebf0" stroke-width="2" stroke-linecap="round"/>
  <rect x="402" y="394" width="76" height="36" rx="8" fill="#303542"/>
  <text x="417" y="418" fill="#e9ebf0" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif" font-size="14" font-weight="700">再通知</text>
  <rect x="490" y="394" width="62" height="36" rx="8" fill="#303542"/>
  <text x="506" y="418" fill="#e9ebf0" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif" font-size="14" font-weight="700">閉じる</text>
</svg>
